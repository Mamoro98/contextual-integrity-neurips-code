task_checklist:
  Define sensor calibration: Agree on the baseline atmospheric pressure readings for
    both stations.
  Select data frequency: Decide whether to report data every 5, 10, or 15 minutes.
  Establish notification protocol: Choose a primary method for alerting each other
    during high-wind events.
  Finalize data format: Agree on using JSON or CSV formatted text for the manual data
    exchange.
