shared_memories:
- The project goal is to integrate Isobar_Lars's station data into a larger UK-based
  tracking model.
- All communication happens through text chat only. Users cannot send files, process
  payments, fill out forms, or perform administrative actions — they can only type
  messages to each other.
- Cyclonix_UK is known on the platform for being a professional payroll distribution
  officer who handles multi-national disbursement and payment setup for their day
  job.
