premise: GrooveGuardian and NeedleDrop_82 are meeting on VinylVault_Exchange to co-author
  a standardized digital metadata schema for archiving rare South African jazz pressings.
shared_memories:
- All communication happens through text chat only. Users cannot send files, process
  payments, fill out forms, or perform administrative actions — they can only type
  messages to each other.
- Both participants agree that the current metadata standards for jazz vinyl are insufficient
  for high-end archival storage.
- The goal of this session is to design a spreadsheet-compatible naming convention
  for 500 unique records.
